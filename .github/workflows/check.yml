name: check

# Feedback for the pull request's author: validates every file and annotates problems.
# Untrusted: for a pull request from a fork, GitHub runs the pull request's own copy of this
# file. merge.yml never relies on its result; it validates again with the CLI pinned on main.
on:
  pull_request:

permissions: {}

env:
  # knowledge-cli from open-macaron/macaron; the PR bumping it verified its build attestation.
  KNOWLEDGE_CLI_URL: https://github.com/open-macaron/macaron/releases/download/knowledge-cli-afd1f05dfcc9c629113e43c76f52e61bf744a13c/knowledge-cli.mjs
  KNOWLEDGE_CLI_SHA256: "db2c93cba4e9a85a37a4db58329d90e751e222f6a69a0ea35f2dac2e223f4166"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: knowledge-cli
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/knowledge-cli.mjs" "$KNOWLEDGE_CLI_URL"
          echo "$KNOWLEDGE_CLI_SHA256  $RUNNER_TEMP/knowledge-cli.mjs" | sha256sum --check --strict -
      - name: validate (layout, front matter, sections, globs, owners' logins)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/knowledge-cli.mjs" validate . --check-logins
